# Nginx конфигурация для Telegram Mini App «Автоковрики EVA-ART»
# Замените your-domain.ru на ваш реальный домен / поддомен на сервере AEZA

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.ru www.your-domain.ru;

    # Редирект HTTP -> HTTPS (обязательно для Telegram WebApp)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name your-domain.ru www.your-domain.ru;

    # Пути к SSL-сертификатам Let's Encrypt (Certbot)
    ssl_certificate /etc/letsencrypt/live/your-domain.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.ru/privkey.pem;

    # Оптимальные параметры безопасности SSL
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # HSTS
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Разрешаем Telegram WebView отображать сайт внутри приложения (X-Frame-Options)
    # Telegram требует, чтобы WebApp мог открываться во фрейме Telegram
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    # Важно: Не блокируйте X-Frame-Options для telegram.org / web.telegram.org

    # Сжатие Gzip для быстрой загрузки Mini App
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Максимальный размер загрузки
    client_max_body_size 20M;

    # Проксирование запросов к приложению FastAPI (порт 8000)
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # WebSocket & Upgrade заголовки
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Передача IP и протокола клиента
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Таймауты
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
